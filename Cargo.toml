[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/amjad2161/Gane"
description = "G.A.N.E NAV — Global Autonomous Navigation Engine (Global Mobility Intelligence Network)"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP / API
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = ">=1.11, <1.12", features = ["v4", "serde"] }

# Math / Linear Algebra
nalgebra = "0.33"

# Error handling
thiserror = "1"
anyhow = "1"

# Channel / concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Testing
approx = "0.5"
